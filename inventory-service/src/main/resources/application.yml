spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:h2:file:~/Users/jeanyves.ruffin/orderflow-data/inventory;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  kafka:
    admin:
      fail-fast: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

orderflow:
  messaging:
    # 'logging' : pas de broker, les evenements sont traces dans la console.
    # Passe a 'kafka' quand ton KafkaEventPublisher existe.
    publisher: kafka

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    fr.orderflow: DEBUG
