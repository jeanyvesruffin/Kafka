# ============================================================
# OrderFlow - environnement Docker (poste AVEC droits administrateur)
# ============================================================
# Tout demarrer (build des images inclus) :
#   docker compose up -d --build
# Infra seule (Kafka + AKHQ), services lances depuis l'IDE ou mvn :
#   docker compose up -d kafka akhq
# Arreter en gardant les donnees / en effacant tout (Kafka + H2) :
#   docker compose down
#   docker compose down -v
#
# Memes ports que le mode sans droits admin (9092, 8081-8084, 8090) :
# ne pas faire tourner les deux modes en meme temps.
# ============================================================
name: orderflow

x-service-env: &service-env
  # Listener interne du broker ; localhost:9092 est reserve a l'hote
  SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
  # La console H2 refuse par defaut les connexions qui ne viennent pas de localhost
  SPRING_H2_CONSOLE_SETTINGS_WEBALLOWOTHERS: "true"

services:

  # --- Broker Kafka 4.3.1, KRaft mono-noeud (broker + controller) -----------
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL : conteneurs (kafka:29092) ; EXTERNAL : hote, IDE, tests manuels (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Memes regles que le server.properties du mode sans admin (dossier technique 12.4)
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --- AKHQ 0.28.0 : UI Kafka sur http://localhost:8090 ---------------------
  akhq:
    image: tchiotludo/akhq:0.28.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            orderflow-docker:
              properties:
                bootstrap.servers: "kafka:29092"

  # --- Services OrderFlow (image construite par la Dockerfile racine) -------
  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    image: orderflow/order-service:0.1.0-SNAPSHOT
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/orders;AUTO_SERVER=TRUE;MODE=PostgreSQL
    volumes:
      - orders-data:/data

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: orderflow/inventory-service:0.1.0-SNAPSHOT
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/inventory;AUTO_SERVER=TRUE;MODE=PostgreSQL
    volumes:
      - inventory-data:/data

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    image: orderflow/payment-service:0.1.0-SNAPSHOT
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/payments;AUTO_SERVER=TRUE;MODE=PostgreSQL
    volumes:
      - payments-data:/data

  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    image: orderflow/notification-service:0.1.0-SNAPSHOT
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      <<: *service-env

volumes:
  kafka-data:
  orders-data:
  inventory-data:
  payments-data:
