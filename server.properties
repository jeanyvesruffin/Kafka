# ============================================================================
# Fichier annoté pour Apache Kafka 4.3.x — mode KRaft (combined broker+controller)
# Basé sur https://kafka.apache.org/43/configuration/broker-configs/
# ============================================================================

############################# Server Basics #############################

# Le rôle de ce serveur. Cette valeur active le mode KRaft (plus de ZooKeeper).
process.roles=broker,controller

# L'ID de ce nœud. Remplace définitivement broker.id comme paramètre "essentiel"
# en KRaft (voir note historique broker.id en bas de fichier).
node.id=1

# Liste des endpoints de bootstrap du quorum de contrôleurs.
# Remplace zookeeper.connect (voir note historique en bas de fichier).
controller.quorum.bootstrap.servers=localhost:9093

############################# Socket Server Settings #############################

listeners=PLAINTEXT://:9092,CONTROLLER://:9093

inter.broker.listener.name=PLAINTEXT

# Inchangé depuis les très anciennes versions dans son principe, mais avant
# Kafka ~0.9 la configuration se faisait via host.name / advertised.host.name
# et port / advertised.port séparés, plutôt que via listeners/advertised.listeners.
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093

controller.listener.names=CONTROLLER

listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600


############################# Log Basics #############################

# Comma-separated list de répertoires de logs. Paramètre "essentiel" en KRaft
# (il n'existe plus de log.dirs "optionnel" comme en mode ZooKeeper classique).
log.dirs=/tmp/kraft-combined-logs

# Toujours valide, mais son "importance" est passée de high à medium dans la doc
# 4.3, et sa portée a changé avec KRaft : pour la création auto de topics, la
# valeur du broker n'est utilisée que si elle est explicitement définie ici ;
# sinon c'est la valeur du contrôleur qui prime (idem pour default.replication.factor).
num.partitions=8

num.recovery.threads.per.data.dir=2

############################# Default topic / replication settings #############################
# Ces paramètres ne figuraient pas dans votre fichier d'origine : ils prennent
# leurs valeurs par défaut si absents, mais autant les rendre explicites.

# Facteur de réplication par défaut pour les topics auto-créés (n'existait pas
# dans votre fichier — défaut Kafka = 1). À adapter en prod (ex: 3).
default.replication.factor=3

# Nombre minimal de réplicas synchronisés requis quand un producer utilise
# acks=all. Inchangé depuis les premières versions (défaut = 1).
min.insync.replicas=2

# Autorise la création automatique de topics. Inchangé depuis les premières
# versions (défaut = true).
auto.create.topics.enable=true

# Autorise la suppression de topics via l'admin client. ATTENTION historique :
# le défaut était FALSE jusqu'à Kafka 1.0.0 (KIP-162, oct. 2017) ; depuis
# Kafka 1.0.0 le défaut est TRUE, comme ci-dessous.
delete.topic.enable=true

############################# Internal Topic Settings  #############################
offsets.topic.replication.factor=3
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=3

############################# Log Flush Policy #############################
#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

# Inchangé depuis les toutes premières versions de Kafka (défaut = 168h = 7 jours).
log.retention.hours=168

#log.retention.bytes=1073741824

# Inchangé depuis les toutes premières versions (défaut = 1 GiB).
log.segment.bytes=1073741824

# Inchangé depuis les toutes premières versions (défaut = 300000 ms = 5 min).
log.retention.check.interval.ms=300000
