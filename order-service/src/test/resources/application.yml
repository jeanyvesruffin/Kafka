# Configuration active uniquement pour les tests Spring que TU ajouteras
# (@SpringBootTest, @DataJpaTest, @EmbeddedKafka...).
# Les tests livres sont unitaires purs et ne chargent aucun contexte.

spring:
  datasource:
    url: jdbc:h2:mem:orders-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

orderflow:
  messaging:
    publisher: kafka
  outbox:
    poll-interval-ms: 3600000
  kafka:
    retry:
      blocking:
        initial-interval: 50ms
        max-interval: 200ms
        max-retries: 3
