# Configuration active uniquement pour les tests Spring que TU ajouteras
# (@SpringBootTest, @DataJpaTest, @EmbeddedKafka...).
# Les tests livres sont unitaires purs et ne chargent aucun contexte.

spring:
  datasource:
    url: jdbc:h2:mem:orders-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
  jpa:
    hibernate:
      ddl-auto: create-drop

orderflow:
  outbox:
    # Relais desactive en test : les tests inspectent la table outbox directement.
    poll-interval-ms: 3600000
