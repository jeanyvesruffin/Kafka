spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:file:~/Users/jeanyves.ruffin/orderflow-data/orders;AUTO_SERVER=TRUE;MODE=PostgreSQL;WRITE_DELAY=0
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      # ErrorHandlingDeserializer enveloppe le vrai deserialiseur : une erreur de deserialisation
      # n'est plus levee dans la boucle de poll (le consumer rebouclerait a l'infini sur le meme
      # offset) mais transmise au listener container, qui l'envoie en DLT (phase 4).
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true     # span consumer + lecture du traceparent (phase 5)
    template:
      observation-enabled: true     # span producer + ecriture du traceparent dans les en-tetes
    admin:
      fail-fast: true

server:
  port: 8081

orderflow:
  messaging:
    publisher: kafka
  outbox:
    poll-interval-ms: 1000
  kafka:
    retry:
      # Reprises bloquantes (DefaultErrorHandler) avant l'envoi en <topic>.DLT
      blocking:
        initial-interval: 200ms
        multiplier: 2.0
        max-interval: 2s
        max-retries: 4

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  tracing:
    sampling:
      probability: 1.0              # TD : on trace tout (0.1 par defaut)
    export:
      otlp:
        enabled: ${ORDERFLOW_TRACING_EXPORT:false}   # true si un collecteur OTLP ecoute (voir README, phase 5)
  otlp:
    metrics:
      export:
        enabled: false              # metriques en pull sur /actuator/prometheus, pas d'export OTLP
  logging:
    export:
      otlp:
        enabled: false
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # traceId/spanId : tracing distribue ; correlationId : celui de la commande (en-tete Kafka -> MDC)
    correlation: "[%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
  level:
    fr.orderflow: DEBUG

