# Configuration des tests Spring (@SpringBootTest + @EmbeddedKafka).
# Elle remplace l'application.yml principal : tout ce dont le contexte a besoin est ici.

spring:
  datasource:
    url: jdbc:h2:mem:payments-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

orderflow:
  messaging:
    publisher: kafka
  payment:
    refusal-threshold: 1000.00
  kafka:
    retry:
      blocking:
        initial-interval: 50ms
        max-interval: 200ms
        max-retries: 3
      # Delais raccourcis : les tests observent les topics de retry sans attendre 1 s puis 2 s
      topics:
        initial-interval: 300ms
        multiplier: 2.0
        max-interval: 1s
        max-attempts: 3
