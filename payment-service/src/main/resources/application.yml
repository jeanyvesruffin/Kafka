spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:h2:file:~/Users/jeanyves.ruffin/orderflow-data/payments;AUTO_SERVER=TRUE;MODE=PostgreSQL;WRITE_DELAY=0
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    admin:
      fail-fast: true
    listener:
      observation-enabled: true     # span consumer + lecture du traceparent (phase 5)
    template:
      observation-enabled: true     # span producer + ecriture du traceparent dans les en-tetes
    consumer:
      auto-offset-reset: earliest
      # Une erreur de deserialisation part en DLT au lieu de faire boucler le consumer (phase 4)
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8083

orderflow:
  messaging:
    publisher: kafka
  payment:
    # Au-dela de ce montant, le simulateur refuse. Permet de declencher a volonte
    # le parcours de compensation (1x sku-005 = 1250,00 > 1000,00).
    refusal-threshold: 1000.00
    # Panne transitoire simulee : les N premiers appels de chaque commande echouent (0 = aucune).
    # 2 : le message passe par inventory.reserved-retry-0 et -retry-1 puis aboutit.
    # 3 ou plus : il finit sur inventory.reserved.DLT.
    transient-failures-per-order: 0
  kafka:
    retry:
      # Reprises bloquantes pour les listeners hors topics de retry
      blocking:
        initial-interval: 200ms
        multiplier: 2.0
        max-interval: 2s
        max-retries: 4
      # Reprises non bloquantes de inventory.reserved : 3 tentatives = origine + retry-0 + retry-1
      topics:
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 8s
        max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  tracing:
    sampling:
      probability: 1.0              # TD : on trace tout (0.1 par defaut)
    export:
      otlp:
        enabled: ${ORDERFLOW_TRACING_EXPORT:false}   # true si un collecteur OTLP ecoute (voir README, phase 5)
  otlp:
    metrics:
      export:
        enabled: false              # metriques en pull sur /actuator/prometheus, pas d'export OTLP
  logging:
    export:
      otlp:
        enabled: false

logging:
  pattern:
    # traceId/spanId : tracing distribue ; correlationId : celui de la commande (en-tete Kafka -> MDC)
    correlation: "[%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
  level:
    fr.orderflow: DEBUG
