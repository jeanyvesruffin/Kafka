spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:h2:file:~/Users/jeanyves.ruffin/orderflow-data/payments;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8083

orderflow:
  messaging:
    # 'logging' : pas de broker, les evenements sont traces dans la console.
    # Passe a 'kafka' quand ton KafkaEventPublisher existe.
    publisher: logging
  payment:
    # Au-dela de ce montant, le simulateur refuse. Permet de declencher a volonte
    # le parcours de compensation (1x sku-005 = 1250,00 > 1000,00).
    refusal-threshold: 1000.00

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    fr.orderflow: DEBUG
